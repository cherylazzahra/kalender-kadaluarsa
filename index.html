<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Kadaluarsa</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.css" rel="stylesheet">

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; margin: 0; }
    #calendar { max-width: 900px; margin: 30px auto; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .fc-daygrid-event { display: block !important; white-space: normal !important; }
    .fc-event.expired { background-color: red !important; color: white !important; }
    .fc-event.near-expired { background-color: orange !important; color: white !important; }
    .fc-event.safe { background-color: green !important; color: white !important; }
    .controls { text-align: center; margin-bottom: 20px; }
    .btn { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { background: #0056b3; }
    .loading { text-align: center; color: #666; }
    .pt-btn { padding: 8px 16px; margin: 5px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .pt-btn:hover { background: #218838; }
  </style>
</head>
<body>
  <h2 style="text-align:center">📅 Kalender Tanggal Kadaluarsa</h2>
  <div class="controls">
    <a href="data_kalenderkui.xlsx" id="excelLink" class="btn" download>Unduh File Excel</a>
    <button id="showDataBtn" class="btn" style="display:none;">Isi Tampilan Lengkap</button>
    <input type="file" id="fileUpload" accept=".xlsx,.xls" style="display:none;">
    <button id="uploadBtn" class="btn">Upload Fi  le Excel (Jika Fetch Gagal)</button>
  </div>
  <div id="loading" class="loading" style="display:none;">Memuat data Excel...</div>
  <div id="calendar"></div>

  <script>
  const excelUrl = document.getElementById("excelLink").href;
  let calendar;
  const eventsData = {};
  const allExcelData = [];

  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }

  function showSystemNotification(title, body, pt, lokasi) {
    if ("Notification" in window && Notification.permission === "granted") {
      const notif = new Notification(title, { body });
      notif.onclick = () => {
        window.focus();
        Swal.fire({
          title: `Peringatan untuk Lokasi ${lokasi}`,
          text: body,
          icon: 'warning',
          background: '#222',
          color: '#fff'
        });
      };
      setTimeout(() => notif.close(), 10000);
    }
  }

  function processExcelData(buffer) {

    /* ================================
       FIX → hapus data lama
    ================================*/
    for (let key in eventsData) delete eventsData[key];
    allExcelData.length = 0;

    if (calendar) calendar.removeAllEvents();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('showDataBtn').style.display = 'inline-block';

    const workbook = XLSX.read(buffer, { type: 'array' });
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const allEvents = [];
    const peringatanDekat = {};

    workbook.SheetNames.forEach(sheetName => {
      const worksheet = workbook.Sheets[sheetName];
      const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

      const lokasiPT = jsonData[0]?.[0] || "Lokasi tidak diketahui";

      for (let i = 1; i < jsonData.length; i++) {
        const row = jsonData[i];
        if (!row || !row[0]) continue;

        const rawDate = row[0];
        let tanggal;

        if (typeof rawDate === "number") {
          const d = XLSX.SSF.parse_date_code(rawDate);
          tanggal = new Date(d.y, d.m - 1, d.d);
        } else if (typeof rawDate === "string") {
          const parts = rawDate.split('/');
          if (parts.length === 3) {
            tanggal = new Date(parts[2], parts[1] - 1, parts[0]);
          } else tanggal = new Date(rawDate);
        }

        if (isNaN(tanggal)) continue;

        tanggal.setHours(12, 0, 0, 0);
        const formattedDate = tanggal.toISOString().split("T")[0];

        const diffDays = Math.floor((tanggal - today) / 86400000);
        let eventClass = diffDays <= 0 ? 'expired' :
                         diffDays <= 3 ? 'near-expired' : 'safe';

        eventsData[formattedDate] = eventsData[formattedDate] || [];
        eventsData[formattedDate].push(row[1] || 'Item');

        allEvents.push({
          title: row[1] || 'Item',
          start: formattedDate,
          allDay: true,
          classNames: [eventClass]
        });

        allExcelData.push({
          pt: sheetName,
          lokasi: lokasiPT,
          tanggal: formattedDate,
          item: row[1] || 'Item'
        });

        if (diffDays >= 0 && diffDays <= 3) {
          if (!peringatanDekat[sheetName]) {
            peringatanDekat[sheetName] = { jumlah: 0, tanggal: new Set(), items: [], lokasi: lokasiPT };
          }
          peringatanDekat[sheetName].jumlah++;
          peringatanDekat[sheetName].tanggal.add(formattedDate);
          peringatanDekat[sheetName].items.push(row[1] || 'Item');
        }
      }
    });

    calendar.addEventSource(allEvents);

    for (const pt in peringatanDekat) {
      const d = peringatanDekat[pt];
      showSystemNotification(
        "Peringatan Kadaluarsa",
        `Lokasi: ${d.lokasi}, Total Unit: ${d.jumlah}, PT: ${pt}`,
        pt, d.lokasi
      );
    }
  }


  /* ============================================================
      🎉 INI BAGIAN YANG SUDAH DIGABUNG (VERSI BENAR)
  ============================================================ */

  function showFullDisplay() {
    const currentStart = calendar.view.currentStart;
    const currentMonth = currentStart.getMonth();
    const currentYear = currentStart.getFullYear();

    const filteredData = allExcelData.filter(row => {
      const rowDate = new Date(row.tanggal);
      return rowDate.getMonth() === currentMonth && rowDate.getFullYear() === currentYear;
    });

    const uniquePTs = [...new Set(filteredData.map(row => row.pt))];

    if (uniquePTs.length === 0) {
      Swal.fire({
        title: 'Data Kosong',
        text: `Belum ada data untuk bulan ${currentStart.toLocaleString('id-ID', { month: 'long' })} ${currentYear}.`,
        icon: 'info',
        background: '#222',
        color: '#fff'
      });
      return;
    }

    let html = '<div style="text-align: center;">';
    uniquePTs.forEach(pt => {
      html += `<button class="pt-btn" onclick="showPTData('${pt}')">${pt}</button>`;
    });
    html += '</div>';

    Swal.fire({
      title: `Isi Tampilan Lengkap - Bulan ${currentStart.toLocaleString('id-ID', { month: 'long' })} ${currentYear}`,
      html: html,
      icon: 'info',
      confirmButtonText: 'Tutup',
      background: '#222',
      color: '#fff',
      width: '90%',
      showCloseButton: true
    });
  }

  function showPTData(pt) {
    const currentStart = calendar.view.currentStart;
    const currentMonth = currentStart.getMonth();
    const currentYear = currentStart.getFullYear();

    const ptData = allExcelData.filter(row =>
      row.pt === pt &&
      new Date(row.tanggal).getMonth() === currentMonth &&
      new Date(row.tanggal).getFullYear() === currentYear
    );

    if (ptData.length === 0) {
      Swal.fire({
        title: 'Data Kosong',
        text: `Tidak ada data untuk PT ${pt} pada bulan ini.`,
        icon: 'info',
        background: '#222',
        color: '#fff'
      });
      return;
    }

    ptData.sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

    let html = `
      <div style="overflow-x: auto; max-height: 50vh; overflow-y: auto; width: 100%; padding: 10px;">
        <table style="width: 100%; border-collapse: collapse; color: white; border: 1px solid #555;">
          <thead>
            <tr style="background: #333;">
              <th style="padding: 8px;">Lokasi</th>
              <th style="padding: 8px;">Tanggal</th>
              <th style="padding: 8px;">Item</th>
            </tr>
          </thead>
          <tbody>
    `;

    ptData.forEach(row => {
      html += `
        <tr style="border: 1px solid #555;">
          <td style="padding: 8px;">${row.lokasi}</td>
          <td style="padding: 8px;">${row.tanggal}</td>
          <td style="padding: 8px;">${row.item}</td>
        </tr>
      `;
    });

    html += `</tbody></table></div>`;

    Swal.fire({
      title: `Data PT ${pt}`,
      html: html,
      icon: 'info',
      confirmButtonText: 'Tutup',
      background: '#222',
      color: '#fff',
      width: '90%',
      showCloseButton: true
    });
  }

  /* ============================================================ */


  document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'id',
      headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
      dateClick: function (info) {
        const clickedDate = info.dateStr;
        if (eventsData[clickedDate]) {
          Swal.fire({
            title: `Tanggal: ${clickedDate}`,
            html: eventsData[clickedDate].map(item => `• ${item}`).join('<br>'),
            icon: 'info',
            background: '#222',
            color: '#fff'
          });
        }
      }
    });

    calendar.render();

    document.getElementById('uploadBtn').addEventListener('click', () =>
      document.getElementById('fileUpload').click()
    );

    document.getElementById('fileUpload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = event => processExcelData(event.target.result);
        reader.readAsArrayBuffer(file);
      }
    });

    document.getElementById('loading').style.display = 'block';

    fetch(excelUrl + "?v=" + Date.now())
      .then(res => res.arrayBuffer())
      .then(buffer => processExcelData(buffer))
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        Swal.fire({
          title: 'Error',
          text: err.message,
          icon: 'error',
          background: '#222',
          color: '#fff'
        });
      });
  });
</script>


</body>
</html>
